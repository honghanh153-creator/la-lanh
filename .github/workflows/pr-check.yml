# Author check in CI for every PR into collab/integration (decision docs/decisions/2026-10-31-ci-pr-check.md).
# Security (GitHub Security Lab "pwn requests"): `pull_request` only (no secrets, read-only token),
# never `pull_request_target`; actions pinned to commit SHAs; minimal permissions.
name: pr-check

on:
  pull_request:
    branches: [collab/integration]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      level: ${{ steps.scope.outputs.level }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        name: Classify changed paths (docs / loop / full)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"
          level=docs
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*.md|docs/*/*.md|docs/*/*/*.md|*.md) ;;
              scripts/collab-*|scripts/codex-review*|scripts/collaboration-*|scripts/launchd/*|.claude/skills/*)
                [ "$level" = docs ] && level=loop ;;
              *) level=full ;;
            esac
          done <<< "$files"
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "scope: $level"

  check:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Docs-only PR
        if: needs.scope.outputs.level == 'docs'
        run: echo "Docs only; the full check is not required for this level."
      - name: Loop-script PR
        if: needs.scope.outputs.level == 'loop'
        run: |
          pnpm install --frozen-lockfile
          pnpm collab:test
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: needs.scope.outputs.level == 'full'
      - name: Full author check (same command as the Mac author check)
        if: needs.scope.outputs.level == 'full'
        env:
          CI: '1'
        run: |
          pnpm install --frozen-lockfile
          make -C vendor/swisseph
          pnpm --filter @la-lanh/web exec playwright install --with-deps chromium
          pnpm check
