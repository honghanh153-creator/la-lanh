<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d0829" />
    <title>Lá Lành · Offline</title>
    <style>
      :root {
        color: #fff5df;
        background: #0f0517;
        font-family: "Avenir Next", "Inter", system-ui, sans-serif;
      }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 82% 16%, rgb(216 250 25 / 18%), transparent 16rem),
          #1d0829;
      }
      main {
        width: min(100% - 2rem, 28rem);
        padding: 1.4rem;
      }
      .brand {
        display: inline-flex;
        padding: 0.55rem 0.75rem 0.45rem;
        color: #180722;
        background: #d8fa19;
        box-shadow: 0.35rem 0.35rem 0 rgb(255 112 95 / 28%);
        font-family: "Avenir Next Condensed", "Arial Narrow", sans-serif;
        font-size: 2rem;
        font-weight: 950;
        transform: rotate(-2deg);
      }
      section {
        margin-top: 2.5rem;
        padding: 2rem 1.4rem;
        color: #180722;
        background: #fff5df;
        box-shadow: 0.7rem 0.8rem 0 rgb(125 74 140 / 38%);
        transform: rotate(-1deg);
      }
      h1 {
        margin: 0 0 0.8rem;
        font-size: 2.2rem;
        line-height: 1;
      }
      p {
        margin: 0;
        color: #5f4768;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">Lá Lành*</span>
      <section>
        <h1>Đang mất sóng một nhịp.</h1>
        <p>App shell vẫn ở đây. Kết nối lại mạng để Lá Lành mở note mới và đồng bộ những gì cần lưu nhé.</p>
      </section>
    </main>
  </body>
</html>
