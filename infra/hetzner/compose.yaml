name: la-lanh

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: la-lanh:${LA_LANH_RELEASE_ID:?Set LA_LANH_RELEASE_ID to an immutable release id}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      LA_LANH_DATABASE_URL_FILE: /run/secrets/database_url
      LA_LANH_GUEST_HASH_KEY_FILE: /run/secrets/guest_hash_key
      LA_LANH_GUEST_ENCRYPTION_KEY_FILE: /run/secrets/guest_encryption_key
      LA_LANH_GENERATION_WORKER_ENABLED: "false"
    entrypoint: ["/usr/local/bin/la-lanh-entrypoint"]
    secrets:
      - database_url
      - guest_hash_key
      - guest_encryption_key
    volumes:
      - ./entrypoint.sh:/usr/local/bin/la-lanh-entrypoint:ro
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=4).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  rewrite-worker:
    profiles:
      - generation
    image: la-lanh:${LA_LANH_RELEASE_ID:?Set LA_LANH_RELEASE_ID to an immutable release id}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      LA_LANH_DATABASE_URL_FILE: /run/secrets/database_url
      LA_LANH_GUEST_ENCRYPTION_KEY_FILE: /run/secrets/guest_encryption_key
      LA_LANH_GENERATION_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      LA_LANH_GENERATION_WORKER_ENABLED: "true"
    entrypoint: ["/usr/local/bin/la-lanh-entrypoint"]
    command: ["python", "-m", "app.domains.content_rewrite.worker"]
    depends_on:
      app:
        condition: service_healthy
    secrets:
      - database_url
      - guest_encryption_key
      - openai_api_key
    volumes:
      - ./entrypoint.sh:/usr/local/bin/la-lanh-entrypoint:ro
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/la-lanh-entrypoint
        - python
        - -m
        - scripts.check_rewrite_worker
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_HOSTNAME: ${APP_HOSTNAME:?Set APP_HOSTNAME to the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  database_url:
    file: ${LA_LANH_SECRETS_DIR:-/opt/la-lanh/secrets}/database_url
  guest_hash_key:
    file: ${LA_LANH_SECRETS_DIR:-/opt/la-lanh/secrets}/guest_hash_key
  guest_encryption_key:
    file: ${LA_LANH_SECRETS_DIR:-/opt/la-lanh/secrets}/guest_encryption_key
  openai_api_key:
    file: ${LA_LANH_SECRETS_DIR:-/opt/la-lanh/secrets}/openai_api_key

volumes:
  caddy-data:
  caddy-config:
