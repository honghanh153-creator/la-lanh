# Public staging stack for owner testing. Own empty PostgreSQL, own keys, no
# production data. Joins the production Compose network only so the shared
# Caddy can reach it as `staging-app`. Auth stays disabled. Generation is off
# unless up.sh is run with STAGING_GENERATION=on (see the Luna runbook); only
# the `generation` profile starts the worker, and only the worker mounts the
# provider key.
name: la-lanh-staging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lalanh
      POSTGRES_USER: lalanh
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    secrets:
      - db_password
    volumes:
      - staging-db:/var/lib/postgresql/data
      - ${LA_LANH_STAGING_SECRETS_DIR:-/opt/la-lanh/staging/secrets}/tls:/tls:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lalanh -d lalanh"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Never name this service "app": on the shared production network the
  # service name is a DNS alias, and Caddy would load-balance production
  # traffic between both stacks.
  staging-app:
    image: la-lanh:${LA_LANH_RELEASE_ID:?Set LA_LANH_RELEASE_ID}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      LA_LANH_DATABASE_URL_FILE: /run/secrets/database_url
      LA_LANH_GUEST_HASH_KEY_FILE: /run/secrets/guest_hash_key
      LA_LANH_GUEST_ENCRYPTION_KEY_FILE: /run/secrets/guest_encryption_key
      LA_LANH_GENERATION_WORKER_ENABLED: "false"
    entrypoint: ["/usr/local/bin/la-lanh-entrypoint"]
    secrets:
      - database_url
      - guest_hash_key
      - guest_encryption_key
      - db_ca.pem
    volumes:
      - ../entrypoint.sh:/usr/local/bin/la-lanh-entrypoint:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      edge: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=4).read()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Mirrors production's rewrite-worker. Never named "rewrite-worker" or "app"
  # and never joined to the shared production network: it reaches the staging
  # database on `internal` and the provider through its own `worker-egress`.
  staging-rewrite-worker:
    profiles:
      - generation
    image: la-lanh:${LA_LANH_RELEASE_ID:?Set LA_LANH_RELEASE_ID}
    restart: unless-stopped
    env_file:
      - app.env
    environment:
      LA_LANH_DATABASE_URL_FILE: /run/secrets/database_url
      LA_LANH_GUEST_HASH_KEY_FILE: /run/secrets/guest_hash_key
      LA_LANH_GUEST_ENCRYPTION_KEY_FILE: /run/secrets/guest_encryption_key
      LA_LANH_GENERATION_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      LA_LANH_GENERATION_WORKER_ENABLED: "true"
      LA_LANH_AUTH_ENABLED: "false"
      LA_LANH_AUTH_GOOGLE_ENABLED: "false"
      LA_LANH_AUTH_DELIVERY_APPROVED: "false"
    entrypoint: ["/usr/local/bin/la-lanh-entrypoint"]
    command: ["python", "-m", "app.domains.content_rewrite.worker"]
    depends_on:
      db:
        condition: service_healthy
      staging-app:
        condition: service_healthy
    secrets:
      - database_url
      - guest_hash_key
      - guest_encryption_key
      - db_ca.pem
      - openai_api_key
    volumes:
      - ../entrypoint.sh:/usr/local/bin/la-lanh-entrypoint:ro
    networks:
      internal: {}
      worker-egress: {}
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/la-lanh-entrypoint
        - python
        - -m
        - scripts.check_rewrite_worker
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  internal:
    internal: true
  worker-egress: {}
  edge:
    external: true
    name: la-lanh_default

secrets:
  db_password:
    file: ${LA_LANH_STAGING_SECRETS_DIR:-/opt/la-lanh/staging/secrets}/db_password
  database_url:
    file: ${LA_LANH_STAGING_SECRETS_DIR:-/opt/la-lanh/staging/secrets}/database_url
  guest_hash_key:
    file: ${LA_LANH_STAGING_SECRETS_DIR:-/opt/la-lanh/staging/secrets}/guest_hash_key
  guest_encryption_key:
    file: ${LA_LANH_STAGING_SECRETS_DIR:-/opt/la-lanh/staging/secrets}/guest_encryption_key
  db_ca.pem:
    file: ${LA_LANH_STAGING_SECRETS_DIR:-/opt/la-lanh/staging/secrets}/db_ca.pem
  # Required only with STAGING_GENERATION=on; mounted into the worker only.
  openai_api_key:
    file: ${LA_LANH_STAGING_SECRETS_DIR:-/opt/la-lanh/staging/secrets}/openai_api_key

volumes:
  staging-db:
